<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Training Video | Avaniysh Interior Solutions (OPC) Pvt. Ltd.</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="wrap top">
        <div class="logo" id="logoBox"></div>
        <div class="spacer"></div>

        <div class="filter-wrap">
          <button
            class="btn"
            id="filterBtn"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path d="M3 5h14M6 10h8M8.5 15h3" />
            </svg>
            Filter <span class="badge" id="filterBadge">0</span>
          </button>
          <div class="panel" id="filterPanel">
            <h4>Skill level</h4>
            <label
              ><input type="checkbox" value="Beginner" /><span
                class="dot"
                style="background: var(--beginner)"
              ></span
              >Beginner<span class="n" data-n="Beginner"></span
            ></label>
            <label
              ><input type="checkbox" value="Medium" /><span
                class="dot"
                style="background: var(--medium)"
              ></span
              >Medium<span class="n" data-n="Medium"></span
            ></label>
            <label
              ><input type="checkbox" value="Advanced" /><span
                class="dot"
                style="background: var(--advanced)"
              ></span
              >Advanced<span class="n" data-n="Advanced"></span
            ></label>
            <button class="clear" id="clearLevels">Clear levels</button>
          </div>
        </div>

        <div class="search">
          <svg
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <circle cx="9" cy="9" r="6" />
            <path d="M14 14l4 4" />
          </svg>
          <input
            id="search"
            type="search"
            placeholder="Search training videos"
            aria-label="Search training videos"
          />
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="wrap">
        <div>
          <div class="eyebrow">Learning &amp; Development</div>
          <h1>Training Video</h1>
          <!-- <p>
            Step-by-step site and installation training, organised by trade and
            skill level.
          </p> -->
        </div>
        <div class="stats" id="stats"></div>
      </div>
    </section>

    <div class="toolbar">
      <div class="wrap">
        <div
          class="chips"
          id="chips"
          role="tablist"
          aria-label="Video categories"
        ></div>
      </div>
    </div>

    <main>
      <div class="wrap">
        <div class="meta">
          <span class="count" id="count"></span>
          <span id="pills" style="display: contents"></span>
          <button class="reset" id="resetAll">Reset all</button>
        </div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty">
          <h3>No videos found</h3>
          <p>Try a different search term or remove some filters.</p>
          <button id="emptyReset">Reset filters</button>
        </div>
      </div>
    </main>

    <footer>
      <div class="wrap">
        <span
          ><b>Avaniysh Interior Solutions (OPC) Pvt. Ltd.</b></span
        >
        <span>&copy; <span id="yr"></span> All rights reserved</span>
      </div>
    </footer>

    <div
      class="modal"
      id="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-box">
        <button class="close" id="closeModal" aria-label="Close video">
          &times;
        </button>
        <div class="ratio">
          <iframe
            id="player"
            title="Training video"
            allow="accelerometer; autoplay; encrypted-media; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
        <div class="modal-info">
          <h3 id="modalTitle"></h3>
          <span class="mtag cat" id="modalCat"></span>
          <span class="mtag" id="modalLvl"></span>
          <a
            class="yt-btn"
            id="ytLink"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M8 5v14l11-7z" />
            </svg>
            Watch on YouTube
          </a>
        </div>
        <div class="modal-hint" id="modalHint">
          If the video doesn’t play here, click on “Watch on YouTube".
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
